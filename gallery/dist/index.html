<!doctype html>
<html lang="en">
<!-- DEV entry only (npm run dev). Production is served by moonglade_gallery.py's
     "/" route, which injects window.MG_BOOT server-side. Dev fakes a minimal boot
     and the Vite proxy supplies real /api data from the running server. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moonglade Athenaeum (dev)</title>
  <!-- PWA installability (2026-08-02). Dev-only paths: Vite serves gallery/public/
       at root ("/") in dev regardless of the "/next/assets/" build base -- the
       production paths (APP_PAGE/LOGIN_PAGE in moonglade_gallery.py) point at
       /next/assets/... instead, where the same public/ files land after
       `npm run build`. No service worker registration -- not in scope. -->
  <link rel="manifest" href="/next/assets/manifest.json">
  <meta name="theme-color" content="#0a0818">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moonglade">
  <link rel="apple-touch-icon" href="/next/assets/icon-180.png">
  <!-- Dev twin of moonglade_gallery.py's _PREPAINT_BOOT_JS: the saved skin and the saved
       type pairing both paint the page, so both are applied before the first frame here
       too. Without it `npm run dev` renders the house look and then jumps to the stored
       one the moment lib/fonts.js reconciles -- the exact flash production doesn't have. -->
  <script>
    try{var _sk=localStorage.getItem('skin');if(_sk&&_sk!=='moonglade')document.documentElement.setAttribute('data-skin',_sk);}catch(e){}
    try{var _ft=JSON.parse(localStorage.getItem('fonts')||'null');if(_ft&&typeof _ft==='object'){if(_ft.hero)document.documentElement.style.setProperty('--font-hero',_ft.hero);if(_ft.system)document.documentElement.style.setProperty('--font-system',_ft.system);}}catch(e){}
  </script>
  <script type="module" crossorigin src="/next/assets/app.js"></script>
  <link rel="stylesheet" crossorigin href="/next/assets/app.css">
</head>
<body>
  <div id="root"></div>
  <script>
    window.MG_BOOT = window.MG_BOOT || {
      dev: true,
      stats: { images: 0, videos: 0, collections: 0 },
      collections: [],
      user: "dev",
      is_local: true,
      is_true_local: true,
      csrf: "",
      build_stamp: "dev",
      band: { height: 340, crop: 30 },
    };
  </script>
</body>
</html>
