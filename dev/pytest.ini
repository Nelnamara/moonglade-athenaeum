[pytest]
# The developer files live in dev\ (since 3.20), the app's code at the repo root above it. Run
# the suite from the repo root with `python -m pytest dev/tests` (CI's command adds
# `-q --ignore=dev/tests/test_similar.py`), or from inside dev\ with a plain `python -m pytest`.
# Either way this file is the config, dev\ is the rootdir, and the repo root goes on sys.path
# so the moonglade package imports.
testpaths = tests
pythonpath = ..
addopts = -v
markers =
    render: browser-rendering assertions (dev/tests/test_render_harness.py). Needs playwright
        plus a chromium binary and skips cleanly without either, so a bare machine stays
        green. Run just these with `-m render`, or exclude them with `-m "not render"`.
