[pytest]
testpaths = tests
addopts = -v
markers =
    render: browser-rendering assertions (tests/test_render_harness.py). Needs playwright
        plus a chromium binary and skips cleanly without either, so a bare machine -- and
        the current CI workflow, which installs no playwright -- stays green. Run just
        these with `-m render`, or exclude them with `-m "not render"`.
